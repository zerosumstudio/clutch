name: CI

on:
    push:
        branches: [main, develop]
    pull_request:
        branches: [main, develop]

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    test:
        name: Test
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, windows-latest]

        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Setup pnpm
              uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

            - name: Setup Node.js
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version-file: .nvmrc
                  cache: 'pnpm'

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Type check
              run: pnpm run type-check

            - name: Lint
              run: pnpm run lint

            - name: Format check
              run: pnpm run format:check

            - name: Test (with coverage)
              run: pnpm run test:coverage

            - name: Keep the coverage report
              if: matrix.os == 'ubuntu-latest'
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: coverage
                  path: coverage/lcov.info
                  retention-days: 1

    coverage:
        name: Coverage
        runs-on: ubuntu-latest
        needs: test
        # Only this job can mint an OIDC token, and it never installs or runs repo code.
        permissions:
            contents: read
            id-token: write

        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Download the coverage report
              uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              with:
                  name: coverage
                  path: coverage

            - name: Upload coverage to Codecov
              uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
              with:
                  use_oidc: true
                  disable_search: true
                  files: ./coverage/lcov.info
                  fail_ci_if_error: false

    build:
        name: Build, pack and smoke test
        runs-on: ubuntu-latest
        needs: test

        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Setup pnpm
              uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

            - name: Setup Node.js
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version-file: .nvmrc
                  cache: 'pnpm'

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Build
              run: pnpm run build

            - name: Size limit
              run: pnpm run size

            - name: Smoke test the build in the repo
              run: pnpm run smoke

            - name: Upload build artifacts
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: dist
                  path: dist
                  retention-days: 7

            - name: Pack the tarball
              run: pnpm pack --pack-destination "$RUNNER_TEMP"

            - name: Install the tarball into a bare consumer
              working-directory: ${{ runner.temp }}
              run: |
                  mkdir -p consumer && cd consumer
                  npm init -y > /dev/null
                  npm pkg set type=module
                  npm install "$RUNNER_TEMP"/zerosumstudio-clutch-*.tgz react react-dom immer

            - name: Smoke test the tarball
              working-directory: ${{ runner.temp }}/consumer
              run: |
                  cp "$GITHUB_WORKSPACE/scripts/smoke.mjs" .
                  node smoke.mjs

            - name: Type-check against the tarball
              working-directory: ${{ runner.temp }}/consumer
              run: |
                  npm install typescript@6 @types/react @types/node
                  cat > index.ts <<'TS'
                  import { createStore, shallowEqual, type Store } from '@zerosumstudio/clutch'
                  import { immer } from '@zerosumstudio/clutch/immer'
                  import { useStore } from '@zerosumstudio/clutch/react'
                  import { WebSocketTransport } from '@zerosumstudio/clutch/sync-ws'

                  interface Counter {
                      count: number
                  }

                  const store: Store<Counter> = createStore<Counter>({ initialState: { count: 0 } })
                  const withImmer = store.with(immer())

                  export type Exports = [
                      typeof store.set,
                      typeof withImmer.mutate,
                      typeof useStore,
                      typeof shallowEqual,
                      typeof WebSocketTransport,
                  ]
                  TS
                  npx tsc --noEmit --strict --module nodenext --moduleResolution nodenext --target es2022 --jsx react-jsx index.ts
