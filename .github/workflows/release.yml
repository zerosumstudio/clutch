name: Release

on:
    push:
        tags:
            - 'v*'

permissions:
    contents: read

jobs:
    release:
        name: Build and pack
        runs-on: ubuntu-latest
        # No id-token here: install and verify run dependency code, which must not be able to
        # mint the OIDC token that publishing trusts.
        permissions:
            contents: read

        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
                  fetch-depth: 0

            - name: Setup pnpm
              uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

            - name: Setup Node.js
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version-file: .nvmrc

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Check tag matches package version
              run: |
                  PKG_VERSION=$(node -p "require('./package.json').version")
                  TAG_VERSION="${GITHUB_REF_NAME#v}"
                  if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
                      echo "Tag $GITHUB_REF_NAME does not match package version $PKG_VERSION"
                      exit 1
                  fi

            - name: Check the tagged commit is on main
              run: |
                  git fetch --no-tags origin main
                  if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
                      echo "Tagged commit $GITHUB_SHA is not on main"
                      exit 1
                  fi

            - name: Verify
              run: pnpm run verify

            - name: Pack the tarball
              run: pnpm pack --pack-destination "$RUNNER_TEMP"

            - name: Keep the tarball
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: package
                  path: ${{ runner.temp }}/zerosumstudio-clutch-*.tgz
                  if-no-files-found: error
                  retention-days: 1

    publish:
        name: Stage on npm
        runs-on: ubuntu-latest
        needs: release
        # The only job with id-token, and it runs no dependency code: it publishes the tarball
        # the release job built.
        permissions:
            contents: read
            id-token: write

        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Setup Node.js
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version-file: .nvmrc
                  registry-url: 'https://registry.npmjs.org'

            - name: Download the tarball
              uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              with:
                  name: package
                  path: ${{ runner.temp }}/package

            - name: Stage on npm
              run: |
                  if [[ "$GITHUB_REF_NAME" == *-* ]]; then DIST_TAG=next; else DIST_TAG=latest; fi
                  npm stage publish "$RUNNER_TEMP"/package/zerosumstudio-clutch-*.tgz --provenance --access public --ignore-scripts --tag "$DIST_TAG"
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

    github-release:
        name: GitHub Release
        runs-on: ubuntu-latest
        needs: publish
        permissions:
            contents: write

        steps:
            - name: Create GitHub Release
              uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
              with:
                  name: Release ${{ github.ref_name }}
                  body: The npm version is staged and waiting for approval on npmjs.com.
                  draft: false
                  prerelease: ${{ contains(github.ref_name, '-') }}
                  generate_release_notes: true
